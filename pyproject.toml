[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "stt_worker*", "translation_worker*", "tts_worker*", "ai_assistant_worker*", "embedding_worker*", "billing_worker*", "livekit_ingress_worker*"]

[project]
name = "warptalk-ai"
version = "0.1.0"
description = "WarpTalk AI Workers — STT, Translation, TTS, AI Assistant"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Redis
    "redis>=5.0",
    # Lightweight audio helpers
    "numpy>=1.26",
    "soundfile>=0.12",
    # Utilities
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    # OpenAI SDK backs STT, translation, assistant, and embeddings per DECISIONS.md.
    # STT uses the Realtime API (gpt-realtime-whisper over WebSocket) — needs the
    # openai[realtime] extra's websockets dependency.
    "openai>=2.45",
    "websockets>=13",
    # LiveKit
    "livekit>=0.11",
    "livekit-api>=0.11",
]

[project.optional-dependencies]
stt = [
]
translation = [
]
tts = [
    "cartesia>=3.2.0",
]
billing = [
    "asyncpg>=0.29",
]
assistant = [
]
embeddings = [
    "qdrant-client>=1.9",
]
ingress = [
    # Optional local VAD path for livekit_ingress_worker; not installed in API-backed Docker workers.
    # torchaudio is a transitive runtime import inside silero-vad's hubconf (utils_vad.py),
    # not declared by torch.hub.load() itself — omitting it fails at model-load time, not install time.
    "torch>=2.1",
    "torchaudio>=2.1",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "fakeredis[lua]>=2.20",
    "ruff>=0.1",
    "mypy>=1.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
