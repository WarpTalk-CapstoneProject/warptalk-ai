# =============================================================
# WarpTalk AI Workers — Local Development
# =============================================================
# Usage:
#   docker compose up stt translation   # Start specific workers
#   docker compose up                   # Start everything
#
# IMPORTANT: Requires warptalk-backend stack running first.
# AI workers connect to the backend's Redis via external network.
#
# GPU workers require NVIDIA Container Toolkit:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:
  # ---- STT Worker ----
  stt:
    build:
      context: .
      target: stt
    env_file: .env
    environment:
      - REDIS_URL=redis://warptalk-redis:6379
    networks:
      - warptalk-backend_warptalk-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ---- Translation Worker ----
  translation:
    build:
      context: .
      target: translation
    env_file: .env
    environment:
      - REDIS_URL=redis://warptalk-redis:6379
    networks:
      - warptalk-backend_warptalk-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ---- TTS Worker ----
  tts:
    build:
      context: .
      target: tts
    env_file: .env
    environment:
      - REDIS_URL=redis://warptalk-redis:6379
    networks:
      - warptalk-backend_warptalk-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ---- AI Assistant Worker ----
  assistant:
    build:
      context: .
      target: assistant
    env_file: .env
    environment:
      - REDIS_URL=redis://warptalk-redis:6379
    networks:
      - warptalk-backend_warptalk-net
    restart: unless-stopped

  # ---- Qdrant Vector DB ----
  qdrant:
    image: qdrant/qdrant:latest
    container_name: warptalk-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - warptalk-backend_warptalk-net
    restart: unless-stopped

volumes:
  qdrantdata:

# Connect to the backend stack's Redis via shared network
networks:
  warptalk-backend_warptalk-net:
    external: true
