# =============================================================
# WarpTalk AI Workers — Local Development
# =============================================================
# Usage:
#   docker compose up stt translation   # Start specific workers
#   docker compose up                   # Start everything
#
# IMPORTANT: Requires warptalk-backend stack running first.
# AI workers connect to the backend's Redis via external network.

services:
  # ---- STT Worker ----
  stt:
    build:
      context: .
      target: stt
    env_file: .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@warptalk-redis:6379
    networks:
      - warptalk-infrastructure_warptalk-net
    restart: unless-stopped

  # ---- Translation Worker ----
  translation:
    build:
      context: .
      target: translation
    env_file: .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@warptalk-redis:6379
    networks:
      - warptalk-infrastructure_warptalk-net
    restart: unless-stopped

  # ---- TTS Worker ----
  tts:
    build:
      context: .
      target: tts
    env_file: .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@warptalk-redis:6379
    networks:
      - warptalk-infrastructure_warptalk-net
    restart: unless-stopped

  # ---- AI Assistant Worker ----
  assistant:
    build:
      context: .
      target: assistant
    env_file: .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@warptalk-redis:6379
    networks:
      - warptalk-infrastructure_warptalk-net
    restart: unless-stopped

  # ---- Embedding Worker ----
  embedding:
    build:
      context: .
      target: embedding
    env_file: .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@warptalk-redis:6379
      - VECTOR_DB_URL=http://qdrant:6333
    networks:
      - warptalk-infrastructure_warptalk-net
    depends_on:
      - qdrant
    restart: unless-stopped

  # ---- Qdrant Vector DB ----
  qdrant:
    image: qdrant/qdrant:latest
    container_name: warptalk-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - warptalk-infrastructure_warptalk-net
    restart: unless-stopped

volumes:
  qdrantdata:

# Connect to the backend stack's Redis via shared network
networks:
  warptalk-infrastructure_warptalk-net:
    external: true
